{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-orange-50 to-yellow-50 flex items-center justify-center p-4"
     x-data="loginForm()">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center mb-6">เข้าสู่ระบบ</h1>
    <input x-model="lineUserId" type="text" placeholder="LINE User ID"
           class="w-full border-2 rounded-xl p-3 mb-4"/>
    <button @click="login()" :disabled="loading"
            class="w-full bg-primary-500 text-white font-bold py-3 rounded-xl">
      <span x-show="!loading">เข้าสู่ระบบ</span>
      <span x-show="loading">กำลังโหลด...</span>
    </button>
    <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-center mt-3"></p>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
function loginForm() {
  return {
    lineUserId: '', loading: false, errorMsg: '',
    async login() {
      this.loading = true; this.errorMsg = '';
      try {
        const res = await fetch('/api/token/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ line_user_id: this.lineUserId })  // ← แก้ตรงนี้
        });
        const data = await res.json();
        if (!res.ok) { this.errorMsg = data.error || 'ไม่พบผู้ใช้งาน'; return; }
        sessionStorage.setItem('jwt', data.access);
        window.location.href = '/kiosk/';
      } catch(e) {
        this.errorMsg = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';
      } finally { this.loading = false; }
    }
  }
}

</script>
{% endblock %}
