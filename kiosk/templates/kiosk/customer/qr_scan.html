{% extends "base.html" %}

{% block title %}สแกน QR Code - ลูกบ้าน{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-orange-50 to-yellow-50 flex items-center justify-center p-4"
     x-data="qrScanner()"
     x-init="startCamera()"
     @beforeunload.window="cleanup()">

  <div class="w-full max-w-sm">

    <!-- Header -->
    <div class="text-center mb-4">
      <div class="text-sm text-gray-500 mb-1">Step 1 of 3</div>
      <h1 class="text-3xl font-bold text-gray-800">สแกน QR Code</h1>
      <p class="text-gray-500 mt-1">ชี้กล้องไปที่ QR Code ที่ได้รับจากไรเดอร์</p>
    </div>

    <!-- Camera viewfinder -->
    <div class="bg-white rounded-2xl shadow-lg border-2 border-primary-200 overflow-hidden mb-4">
      <div class="relative aspect-square bg-black" style="aspect-ratio: 1">
        <video x-ref="video" x-show="!cameraError"
               autoplay playsinline class="w-full h-full object-cover"></video>

        <!-- Scan overlay -->
        <div x-show="!cameraError" class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="w-48 h-48 border-4 border-primary-400 rounded-2xl opacity-80">
            <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary-500 rounded-tl-xl"></div>
            <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary-500 rounded-tr-xl"></div>
            <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary-500 rounded-bl-xl"></div>
            <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary-500 rounded-br-xl"></div>
          </div>
        </div>

        <!-- Camera error -->
        <div x-show="cameraError"
             class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-white p-6 text-center">
          <span class="text-4xl mb-3">📷</span>
          <p class="font-bold text-lg">เปิดกล้องไม่ได้</p>
          <p class="text-gray-300 text-xs mt-1" x-text="cameraError"></p>
          <button type="button" @click="useMockScan()"
                  class="mt-4 px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-xs font-semibold rounded-lg shadow active:scale-95 transition-all">
            จำลองสแกน QR ล่าสุด (สำหรับทดสอบ)
          </button>
        </div>

        <!-- Scanning indicator -->
        <div x-show="scanning && !cameraError"
             class="absolute bottom-3 left-0 right-0 flex justify-center">
          <div class="bg-black/60 text-white text-xs px-3 py-1 rounded-full flex items-center gap-2">
            <div class="w-2 h-2 bg-primary-400 rounded-full animate-pulse"></div>
            กำลังสแกน...
          </div>
        </div>
      </div>

      <!-- Status message -->
      <div x-show="statusMsg"
           x-transition
           class="px-4 py-3 text-center text-sm font-medium"
           :class="statusType === 'error' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'"
           x-text="statusMsg">
      </div>
    </div>

    <!-- Choose from gallery -->
    <div class="mb-4">
      <label class="block w-full text-center bg-white border-2 border-primary-200 text-primary-600 font-medium
                    py-3 rounded-xl hover:bg-primary-50 active:scale-95 transition-all shadow-sm cursor-pointer">
        🖼️ อัปโหลดรูป QR Code จากคลังรูปภาพ
        <input type="file" accept="image/*" class="hidden" @change="scanFromGallery($event)">
      </label>
    </div>

    <!-- Manual / Switch -->
    <a href="{% url 'kiosk:customer_pin_entry' %}"
       class="block w-full text-center bg-white border-2 border-gray-200 text-gray-700 font-medium
              py-3 rounded-xl hover:bg-gray-50 active:scale-95 transition-all shadow-sm mb-4">
      🔢 ใช้รหัส PIN แทน
    </a>

    <!-- Back -->
    <div class="text-center">
      <a href="{% url 'kiosk:customer_method_select' %}"
         class="text-gray-500 hover:text-gray-700 text-sm underline underline-offset-2">
        ← กลับเลือกวิธียืนยัน
      </a>
    </div>

  </div>
</div>

<canvas id="qr-canvas" class="hidden"></canvas>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
function qrScanner() {
  return {
    stream: null,
    scanning: false,
    cameraError: '',
    statusMsg: '',
    statusType: '',
    _scanInterval: null,

    async startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        this.cameraError = 'ระบบกล้องต้องใช้งานผ่าน HTTPS หรือ localhost เท่านั้น (บนโทรศัพท์ให้เชื่อมต่อแบบปลอดภัย หรือกดปุ่มจำลองสแกนด้านบน หรือใช้ PIN แทน)';
        return;
      }
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        this.$refs.video.srcObject = this.stream;
        this.scanning = true;
        this._scanInterval = setInterval(() => this.scanFrame(), 500);
      } catch (e) {
        this.cameraError = e.message || 'กรุณาอนุญาตให้ใช้กล้อง';
      }
    },

    useMockScan() {
      const booking = JSON.parse(sessionStorage.getItem('booking') || '{}');
      if (booking.qr_data) {
        this.onDetected(booking.qr_data);
      } else {
        Alpine.store('toast').warning('ไม่พบข้อมูลการจองล่าสุดในเครื่องนี้ กรุณาใช้รหัส PIN แทน');
      }
    },

    scanFromGallery(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.getElementById('qr-canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            this.onDetected(code.data);
          } else {
            Alpine.store('toast').error('ไม่พบ QR Code ในรูปภาพ กรุณาใช้รูปที่มี QR Code ชัดเจน');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    },

    scanFrame() {
    const video = this.$refs.video;
    if (!video || video.readyState < 2) return;
    const canvas = document.getElementById('qr-canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code) this.onDetected(code.data);
    },


    async onDetected(code) {
      if (!this.scanning) return;
      this.scanning = false;
      clearInterval(this._scanInterval);
      try {
        const url = `/api/lockers/verify-qr/`;
        const payload = await this.$api.post(url, { code });
        sessionStorage.setItem('pickup', JSON.stringify(payload));
        this.cleanup();
        window.location.href = '{% url "kiosk:customer_success" %}';
      } catch (e) {
        this.statusMsg = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';
        this.statusType = 'error';
        this.scanning = true;
      }
    },

    cleanup() {
      clearInterval(this._scanInterval);
      if (this.stream) {
        this.stream.getTracks().forEach(t => t.stop());
        this.stream = null;
      }
    },
  };
}
</script>
{% endblock %}
