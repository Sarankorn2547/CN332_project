<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Door Animation</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.11/dist/cdn.min.js"></script>
</head>
<body style="background:#1e293b; display:flex; flex-direction:column; align-items:center; padding:40px; font-family:sans-serif; color:white;">

  <h2>Alpine.js Door Animation Test</h2>
  <p id="status" style="margin-bottom:20px; color:#fbbf24;">isOpen = false</p>

  <div x-data="{ isOpen: false }" style="perspective: 1000px; width: 200px; height: 200px; backface-visibility: visible; -webkit-backface-visibility: visible;">
    <div
      :style="isOpen
        ? 'transform: rotateY(-80deg); transition: transform 0.6s ease; transform-origin: left center;'
        : 'transform: rotateY(0deg);   transition: transform 0.6s ease; transform-origin: left center;'"
      style="background: #3b82f6; width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:4px; font-size:18px; font-weight:bold;"
      @click="isOpen = !isOpen; document.getElementById('status').textContent = 'isOpen = ' + isOpen">
      คลิกเพื่อเปิด
    </div>
  </div>

  <p style="margin-top:30px; font-size:13px; color:#94a3b8;">
    ถ้ากล่องสีน้ำเงินหมุนได้ → Alpine + CSS ทำงานปกติ<br>
    ถ้าไม่หมุน → ปัญหาอยู่ที่ Alpine.js ไม่โหลด หรือ CDN ล้มเหลว
  </p>
</body>
</html>
