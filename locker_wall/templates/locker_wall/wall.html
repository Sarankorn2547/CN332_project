{% extends "base.html" %}
{% load static %}

{% block title %}Locker Wall{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'locker_wall/css/locker.css' %}">
{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-900 text-white p-6"
     x-data="lockerWallApp(JSON.parse(document.getElementById('lockers-data').textContent))"
     x-init="init()"
     @beforeunload.window="cleanup()">
    <!-- ===== Header ===== -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-yellow-300">
            🔒 Locker Wall
        </h1>
        <!-- Auto-refresh indicator -->
        <div class="flex items-center gap-2 text-sm text-gray-400">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <span>Live</span>
        </div>
    </div>

    <!-- ===== Filter Tabs (ประเภทตู้) ===== -->
    <div class="flex gap-2 mb-6 flex-wrap">
        <button @click="filterType = 'ALL'"
                :class="filterType === 'ALL' ? 'tab-active' : 'bg-slate-700 text-gray-300 hover:bg-slate-600'"
                class="px-4 py-2 rounded-full text-sm font-medium transition-all">
            ทั้งหมด
        </button>
        <button @click="filterType = 'Standard'"
                :class="filterType === 'Standard' ? 'tab-active' : 'bg-slate-700 text-gray-300 hover:bg-slate-600'"
                class="px-4 py-2 rounded-full text-sm font-medium transition-all">
            🗄 Standard
        </button>
        <button @click="filterType = 'Refrigerated'"
                :class="filterType === 'Refrigerated' ? 'tab-active' : 'bg-slate-700 text-gray-300 hover:bg-slate-600'"
                class="px-4 py-2 rounded-full text-sm font-medium transition-all">
            ❄️ Refrigerated
        </button>
    </div>

    <!-- ===== Status Summary ===== -->
    <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-slate-800 rounded-xl p-3 text-center border border-green-500/30">
            <div class="text-2xl font-bold text-green-400"
                 x-text="filteredLockers.filter(l => l.status.toLowerCase() === 'available').length"></div>
            <div class="text-xs text-gray-400 mt-1">ว่าง</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-3 text-center border border-red-500/30">
            <div class="text-2xl font-bold text-red-400"
                 x-text="filteredLockers.filter(l => l.status.toLowerCase() === 'occupied').length"></div>
            <div class="text-xs text-gray-400 mt-1">มีของ</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-3 text-center border border-yellow-500/30">
            <div class="text-2xl font-bold text-yellow-400"
                 x-text="filteredLockers.filter(l => l.status.toLowerCase() === 'booked').length"></div>
            <div class="text-xs text-gray-400 mt-1">จอง</div>
        </div>
    </div>

    <!-- ===== Locker Grid ===== -->
    <div class="locker-grid"
         id="locker-grid">

        <template x-for="locker in filteredLockers" :key="locker.id">
            <div class="flex flex-col items-center space-y-3">

                <!-- ตัวตู้ 3D -->
                <div class="relative w-44 h-44 bg-gray-800 border-4 border-gray-700 perspective-1000 shadow-2xl rounded-sm">

                    <!-- ข้างในตู้ -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950">
                        <span class="text-[10px] text-gray-500 mb-1" x-text="locker.size + ' | ' + locker.type"></span>
                        <div class="text-xs font-mono mt-1"
                             :class="{
                                'text-green-400':  locker.status.toLowerCase() === 'available',
                                'text-red-400':    locker.status.toLowerCase() === 'occupied',
                                'text-yellow-400': locker.status.toLowerCase() === 'booked'
                             }"
                             x-text="locker.status.toUpperCase()">
                        </div>
                        <!-- แสดงว่ามีของข้างในไหม -->
                        <div x-show="locker.has_object"
                             class="mt-2 text-lg">📦</div>
                    </div>

                    <!-- LED Indicator -->
                    <div class="absolute top-2 right-2 z-20">
                        <div class="w-3 h-3 rounded-full transition-all duration-500"
                             :class="{
                                'led-available': locker.status.toLowerCase() === 'available',
                                'led-occupied':  locker.status.toLowerCase() === 'occupied',
                                'led-booked':    locker.status.toLowerCase() === 'booked'
                             }">
                        </div>
                    </div>

                    <!-- ประตูตู้ (3D) -->
                    <div class="absolute inset-0 bg-gray-700 border-2 border-gray-900
                            z-10 flex items-center justify-center shadow-2xl rounded-sm cursor-pointer transition-door"
                         :class="{ 'door-open': locker.isOpen }"
                         @click="toggleDoor(locker)">
                        <!-- ชื่อตู้ -->
                        <div class="text-white font-bold text-xl select-none"
                             x-text="locker.local_id"></div>
                        <!-- มือจับประตู -->
                        <div class="absolute right-2 w-1.5 h-8 bg-gray-900 rounded-full shadow-inner"></div>
                    </div>
                </div>

                <!-- Label ใต้ตู้ -->
                <div class="text-center">
                    <div class="text-sm font-semibold text-gray-200" x-text="locker.local_id"></div>
                    <div class="text-xs text-gray-500" x-text="locker.size"></div>
                </div>

            </div>
        </template>

        <!-- ถ้าไม่มีตู้ -->
        <div x-show="filteredLockers.length === 0"
             class="col-span-full text-center text-gray-500 py-16">
            <div class="text-4xl mb-3">📭</div>
            <div>ไม่มีตู้ในหมวดนี้</div>
        </div>

    </div>

    <!-- ===== Control Panel (Sprint 1 - Test Mode) ===== -->
    <div class="mt-10 border-t border-slate-700 pt-6">
        <p class="text-xs text-gray-500 text-center mb-4">
            🛠 Control Panel — Sprint 1 Test Mode
        </p>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <template x-for="locker in filteredLockers" :key="'ctrl-' + locker.id">
                <div class="bg-slate-800 p-3 rounded-lg border border-slate-600 text-xs">
                    <p class="font-bold text-gray-300 mb-2" x-text="locker.local_id"></p>
                    <!-- Toggle Door -->
                    <button @click="toggleDoor(locker)"
                            class="w-full py-1 mb-1 bg-slate-600 hover:bg-slate-500 rounded transition">
                        Toggle Door
                    </button>
                    <!-- Status buttons -->
                    <div class="flex gap-1">
                        <button @click="locker.status = 'available'"
                                class="flex-1 h-4 bg-green-600 rounded hover:opacity-80"></button>
                        <button @click="locker.status = 'occupied'"
                                class="flex-1 h-4 bg-red-600 rounded hover:opacity-80"></button>
                        <button @click="locker.status = 'booked'"
                                class="flex-1 h-4 bg-yellow-500 rounded hover:opacity-80"></button>
                    </div>
                </div>
            </template>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script id="lockers-data" type="application/json">{{ lockers_json|safe }}</script>
<script>
function lockerWallApp(initialLockers) {
    return {
        lockers: initialLockers,
        filterType: 'ALL',
        wsConnected: false,
        _ws: null,

        init() {
            this._connectWS();
        },

        get filteredLockers() {
            if (this.filterType === 'ALL') return this.lockers;
            return this.lockers.filter(l => l.type === this.filterType);
        },

        toggleDoor(locker) {
            locker.isOpen = !locker.isOpen;
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
            fetch(`/api/lockers/${locker.id}/open/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': csrfToken, 'Content-Type': 'application/json' },
            }).catch(() => {});
        },

        _connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            // Use project_id=1, building_id=1 as default if building context isn't passed yet.
            const buildingId = 1;
            const wsUrl = `${proto}://${location.host}/ws/lockers/${buildingId}/`;
            
            const ws = new WebSocket(wsUrl);
            this._ws = ws;

            ws.onopen = () => {
                this.wsConnected = true;
                console.log('WS connected to', wsUrl);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'locker.snapshot') {
                        // For snapshot, we can merge or replace.
                        // Assuming msg.lockers returns full structure, we map it to existing ones
                        // or just replace (but keep isOpen state).
                        const isOpenMap = {};
                        this.lockers.forEach(l => { isOpenMap[l.id] = l.isOpen; });
                        
                        this.lockers = msg.lockers.map(l => ({
                            ...l, 
                            isOpen: isOpenMap[l.id] || false,
                            local_id: l.local_id || l.id.split('-').pop()
                        }));
                    } else if (msg.type === 'locker.updated') {
                        const idx = this.lockers.findIndex(l => l.id === msg.locker.id);
                        if (idx !== -1) {
                            const oldIsOpen = this.lockers[idx].isOpen;
                            this.lockers[idx] = { 
                                ...msg.locker, 
                                isOpen: oldIsOpen,
                                local_id: msg.locker.local_id || msg.locker.id.split('-').pop()
                            };
                        }
                    }
                } catch (e) {
                    console.error("WS parsing error", e);
                }
            };

            ws.onclose = () => {
                this.wsConnected = false;
                console.log('WS disconnected, retrying in 3s...');
                setTimeout(() => { if (this._ws === ws) this._connectWS(); }, 3000);
            };

            ws.onerror = (err) => {
                console.error("WS error", err);
                this.wsConnected = false;
            };
        },
        
        cleanup() {
            if (this._ws) {
                this._ws.onclose = null;
                this._ws.close();
                this._ws = null;
            }
        }
    }
}
</script>
{% endblock %}
